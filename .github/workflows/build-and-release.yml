name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        include:
          - os: ubuntu-latest
            artifact_name: linux
            lib_extension: .a
          - os: windows-latest
            artifact_name: windows
            lib_extension: .lib

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.13

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git



    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      run: |
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_INSTALL_PREFIX=../install/${{ matrix.build_type }}

    - name: Build library
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel

    - name: Install library (Linux)
      if: runner.os == 'Linux'
      run: |
        cd build
        cmake --install .

    - name: Install library (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        cmake --install . --config ${{ matrix.build_type }}

    - name: Get version and commit info (Linux)
      if: runner.os == 'Linux'
      id: version_info_linux
      run: |
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=${{ github.event.inputs.version || 'dev' }}
        fi
        COMMIT_SHORT=${GITHUB_SHA::7}
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "COMMIT_SHORT=$COMMIT_SHORT" >> $GITHUB_OUTPUT

    - name: Get version and commit info (Windows)
      if: runner.os == 'Windows'
      id: version_info_windows
      run: |
        if ("${{ github.ref }}" -like "refs/tags/v*") {
          $VERSION = "${{ github.ref }}" -replace "refs/tags/v", ""
        } else {
          $VERSION = "${{ github.event.inputs.version || 'dev' }}"
        }
        $COMMIT_SHORT = "${{ github.sha }}".Substring(0, 7)
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "COMMIT_SHORT=$COMMIT_SHORT" >> $env:GITHUB_OUTPUT

    - name: Create distribution package (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir -p dist
        cd install/${{ matrix.build_type }}
        
        # Create package structure
        mkdir -p netp-v${{ steps.version_info_linux.outputs.VERSION }}-${{ steps.version_info_linux.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}
        cp -r include lib netp-v${{ steps.version_info_linux.outputs.VERSION }}-${{ steps.version_info_linux.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}/
        
        # Create archive
        tar -czf ../../dist/netp-v${{ steps.version_info_linux.outputs.VERSION }}-${{ steps.version_info_linux.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}.tar.gz netp-v${{ steps.version_info_linux.outputs.VERSION }}-${{ steps.version_info_linux.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}

    - name: Create distribution package (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir -p dist
        cd install/${{ matrix.build_type }}
        
        # Create package structure
        mkdir -p netp-v${{ steps.version_info_windows.outputs.VERSION }}-${{ steps.version_info_windows.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}
        cp -r include lib netp-v${{ steps.version_info_windows.outputs.VERSION }}-${{ steps.version_info_windows.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}/
        
        # Create archive
        Compress-Archive -Path netp-v${{ steps.version_info_windows.outputs.VERSION }}-${{ steps.version_info_windows.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }} -DestinationPath ../../dist/netp-v${{ steps.version_info_windows.outputs.VERSION }}-${{ steps.version_info_windows.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}.zip

    - name: Upload build artifacts (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: netp-v${{ steps.version_info_linux.outputs.VERSION }}-${{ steps.version_info_linux.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}
        path: dist/
        retention-days: 30

    - name: Upload build artifacts (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: netp-v${{ steps.version_info_windows.outputs.VERSION }}-${{ steps.version_info_windows.outputs.COMMIT_SHORT }}-${{ matrix.artifact_name }}
        path: dist/
        retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.VERSION }}
        name: Release v${{ steps.get_version.outputs.VERSION }}
        body: |
          ## netp Library v${{ steps.get_version.outputs.VERSION }}
          
          ### What's New
          - Pre-built libraries for multiple platforms
          - Debug and Release builds available
          
          ### Downloads
          This release includes pre-built libraries for:
          - Windows (x64)
          - Linux (x64)
          
          ### Installation
          1. Download the appropriate package for your platform
          2. Extract the archive
          3. Add the `include/` directory to your include path
          4. Link against the library files in `lib/`
          
          ### Building from Source
          ```bash
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          ```
          
          ### Requirements
          - C++17 compiler
          - CMake 3.10+
          - libevent 2.1+
        files: |
          artifacts/*/netp-v${{ steps.get_version.outputs.VERSION }}-*-windows.zip
          artifacts/*/netp-v${{ steps.get_version.outputs.VERSION }}-*-linux.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  manual-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Create manual release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.event.inputs.version }}
        name: Release v${{ github.event.inputs.version }}
        body: |
          ## netp Library v${{ github.event.inputs.version }}
          
          ### What's New
          - Pre-built libraries for multiple platforms
          - Debug and Release builds available
          
          ### Downloads
          This release includes pre-built libraries for:
          - Windows (x64)
          - Linux (x64)
          
          ### Installation
          1. Download the appropriate package for your platform
          2. Extract the archive
          3. Add the `include/` directory to your include path
          4. Link against the library files in `lib/`
          
          ### Building from Source
          ```bash
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          ```
          
          ### Requirements
          - C++17 compiler
          - CMake 3.10+
          - libevent 2.1+
        files: |
          artifacts/*/netp-v${{ github.event.inputs.version }}-*-windows.zip
          artifacts/*/netp-v${{ github.event.inputs.version }}-*-linux.tar.gz
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 