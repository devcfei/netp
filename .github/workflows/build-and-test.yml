name: Build

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release, Debug]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v1.13

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake git



    - name: Create build directory
      run: mkdir -p build

    - name: Configure CMake
      run: |
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_INSTALL_PREFIX=../install/${{ matrix.build_type }}

    - name: Build library and samples
      run: |
        cd build
        cmake --build . --config ${{ matrix.build_type }} --parallel

    - name: Install library (Linux)
      if: runner.os == 'Linux'
      run: |
        cd build
        cmake --install .

    - name: Install library (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        cmake --install . --config ${{ matrix.build_type }}



 